<!DOCTYPE html>
<html>
<head>
    <title>Chisel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chisel">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="container">
        <h1>Chisel</h1>
        <textarea id="input" rows="15" cols="50"></textarea>
        <div class="button-container">
            <button onclick="clean()" ontouchstart="">Clean</button>
        </div>
        <div class="container" id="result" hidden>
            <h2 id="verse_ref"></h2>
            <div class="button-container">
                <button onclick="copyVerseRef(this)" ontouchstart="">Copy</button>
            </div>
            <textarea id="output" rows="15" cols="50"></textarea>
            <div class="button-container">
                <button onclick="copyVerse(this)" ontouchstart="">Copy</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/chisel/sw.js');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
